services:
  n8n:
    image: n8nio/n8n:latest
    container_name: music-news-digest-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config:/config:ro

volumes:
  n8n_data:
