services:
  n8n:
    image: n8nio/n8n:latest
    container_name: music-news-digest-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Lets Code nodes `require('fs')` to read config/config.json and
      # persist state/run-log files under /data. Everything else in the
      # workflows stays in n8n's normal expression sandbox.
      - NODE_FUNCTION_ALLOW_BUILTIN=fs
      # Lets Code nodes read $env (LLM_API_KEY, TELEGRAM_BOT_TOKEN) — n8n
      # blocks this by default. See README "Security notes" for why that's
      # an acceptable tradeoff here but not for a publicly exposed instance.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config:/config:ro
      - ./data:/data

volumes:
  n8n_data:
